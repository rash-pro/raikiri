<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raikiri Roulette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="roulette.css">
</head>
<body>
    <main id="stage" class="stage" hidden>
        <h1 id="title" class="title"></h1>
        <div class="wheel-wrap">
            <canvas id="wheel" width="760" height="800"></canvas>
            <section id="result" class="result" hidden>
                <span class="result-label">FINAL FANTASY</span>
                <strong id="result-number" class="result-number"></strong>
                <span id="result-year" class="result-year"></span>
            </section>
        </div>
    </main>
    <canvas id="fx" class="fx" width="960" height="540"></canvas>
    <script type="module" src="roulette.js"></script>
</body>
</html>
